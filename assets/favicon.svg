<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Noeta architecture mark: an entry node fanning out into the graph. Entry node in the
       brand blue (accent, the interactive voice); the graph it fans into in the atmospheric
       mint (accent-2). Matches the VS Code extension's marketplace tile. -->
  <rect width="64" height="64" rx="14" fill="#0b0d10"/>
  <g transform="translate(14 14) scale(1.5)" fill="none"
     stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#4fe0a8">
      <path d="M7 6.4 L16.9 9.3" stroke-opacity="0.6"/>
      <path d="M5.9 7.3 L8.4 16.9" stroke-opacity="0.6"/>
      <path d="M11.1 19 L16.9 19" stroke-opacity="0.6"/>
      <path d="M19 12.1 L19 16.9" stroke-opacity="0.6"/>
      <circle cx="19" cy="10" r="2.1" fill="#0b0d10"/>
      <circle cx="9" cy="19" r="2.1" fill="#0b0d10"/>
      <circle cx="19" cy="19" r="2.1" fill="#0b0d10"/>
    </g>
    <circle cx="5" cy="5" r="2.4" fill="#4f8ff7" stroke="#4f8ff7"/>
  </g>
</svg>
